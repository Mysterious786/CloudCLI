name: Build & Release CloudCLI

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.2.3

# ── Explicit permissions ──────────────────────────────────────────────────────
permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # ── Checkout code ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Setup Java ─────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── Build JAR ──────────────────────────────────────────────────────────
      - name: Inject credentials into application.yml
        run: |
          sed -i "s|\${BACKBLAZE_ACCESS_KEY:}|\${BACKBLAZE_ACCESS_KEY:${{ secrets.BACKBLAZE_ACCESS_KEY }}}|g" src/main/resources/application.yml
          sed -i "s|\${BACKBLAZE_SECRET_KEY:}|\${BACKBLAZE_SECRET_KEY:${{ secrets.BACKBLAZE_SECRET_KEY }}}|g" src/main/resources/application.yml
          sed -i "s|\${EMAIL_USERNAME:}|\${EMAIL_USERNAME:${{ secrets.EMAIL_USERNAME }}}|g" src/main/resources/application.yml
          sed -i "s|\${EMAIL_PASSWORD:}|\${EMAIL_PASSWORD:${{ secrets.EMAIL_PASSWORD }}}|g" src/main/resources/application.yml
          sed -i "s|\${EMAIL_FROM:}|\${EMAIL_FROM:${{ secrets.EMAIL_USERNAME }}}|g" src/main/resources/application.yml
          sed -i "s|\${EMAIL_TO:}|\${EMAIL_TO:${{ secrets.EMAIL_USERNAME }}}|g" src/main/resources/application.yml
          sed -i "s|\${DATABASE_URL:jdbc:h2:file:./data/cloudcli;AUTO_SERVER=TRUE}|\${DATABASE_URL:${{ secrets.DATABASE_URL }}}|g" src/main/resources/application.yml
          sed -i "s|\${DATABASE_USERNAME:sa}|\${DATABASE_USERNAME:${{ secrets.DATABASE_USERNAME }}}|g" src/main/resources/application.yml
          sed -i "s|\${DATABASE_PASSWORD:}|\${DATABASE_PASSWORD:${{ secrets.DATABASE_PASSWORD }}}|g" src/main/resources/application.yml

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      # ── Rename JAR ─────────────────────────────────────────────────────────
      - name: Rename JAR
        run: cp target/cloudcli-*.jar cloudcli.jar

      # ── Get version from tag ───────────────────────────────────────────────
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ── Create GitHub Release ──────────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "CloudCLI ${{ steps.version.outputs.VERSION }}"
          body: |
            ## ☁️ CloudCLI ${{ steps.version.outputs.VERSION }}
            
            Multi-Database Backup CLI Tool
            
            ### 🚀 Quick Install
            
            **macOS / Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```
            
            **Manual Download:**
            Download `cloudcli.jar` below and run:
            ```bash
            java -jar cloudcli.jar
            ```
            
            ### 📋 Requirements
            - Java 17 or higher
            
            ### 🔧 What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            
            ---
            Developed by **Saqlain Zarjis Ansari**
          files: |
            cloudcli.jar
            install.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
