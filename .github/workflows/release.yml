name: Build & Release CloudCLI

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.2.3

# ── Explicit permissions ──────────────────────────────────────────────────────
permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # ── Checkout code ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Setup Java ─────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── Inject credentials ─────────────────────────────────────────────────
      - name: Create production credentials file
        run: |
          cat > src/main/resources/application-production.properties << EOF
          backup.storage.backblaze.access-key=${{ secrets.BACKBLAZE_ACCESS_KEY }}
          backup.storage.backblaze.secret-key=${{ secrets.BACKBLAZE_SECRET_KEY }}
          backup.storage.backblaze.bucket=cloudcli-backups
          backup.storage.backblaze.region=us-east-005
          backup.storage.backblaze.endpoint=https://s3.us-east-005.backblazeb2.com
          backup.storage.backblaze.enabled=true
          backup.notification.email.enabled=true
          backup.notification.email.username=${{ secrets.EMAIL_USERNAME }}
          backup.notification.email.password=${{ secrets.EMAIL_PASSWORD }}
          backup.notification.email.from=${{ secrets.EMAIL_USERNAME }}
          backup.notification.email.to=${{ secrets.EMAIL_USERNAME }}
          backup.notification.email.smtp-host=smtp.gmail.com
          backup.notification.email.smtp-port=587
          backup.notification.email.use-tls=true
          backup.notification.email.html-enabled=true
          spring.datasource.url=${{ secrets.DATABASE_URL }}
          spring.datasource.username=${{ secrets.DATABASE_USERNAME }}
          spring.datasource.password=${{ secrets.DATABASE_PASSWORD }}
          spring.jpa.hibernate.ddl-auto=update
          EOF

      # ── Build JAR ──────────────────────────────────────────────────────────
      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      # ── Rename JAR ─────────────────────────────────────────────────────────
      - name: Rename JAR
        run: cp target/cloudcli-*.jar cloudcli.jar

      # ── Get version from tag ───────────────────────────────────────────────
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ── Create GitHub Release ──────────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "CloudCLI ${{ steps.version.outputs.VERSION }}"
          body: |
            ## ☁️ CloudCLI ${{ steps.version.outputs.VERSION }}
            
            Multi-Database Backup CLI Tool
            
            ### 🚀 Quick Install
            
            **macOS / Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```
            
            **Manual Download:**
            Download `cloudcli.jar` below and run:
            ```bash
            java -jar cloudcli.jar
            ```
            
            ### 📋 Requirements
            - Java 17 or higher
            
            ### 🔧 What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            
            ---
            Developed by **Saqlain Zarjis Ansari**
          files: |
            cloudcli.jar
            install.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
